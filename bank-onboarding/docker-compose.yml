services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${BANK_DATABASE_PASSWORD:?Set BANK_DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${BANK_DATABASE_PORT:-15432}:5432"
    volumes:
      - bank-data:/var/lib/postgresql/data
volumes:
  bank-data:
# Explicit allocation avoids exhausted Docker default address pools.
# Change BANK_DOCKER_SUBNET if this range conflicts with another environment.
networks:
  default:
    ipam:
      config:
        - subnet: ${BANK_DOCKER_SUBNET:-10.243.0.0/24}
