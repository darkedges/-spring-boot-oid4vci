<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${bankName + ' - Onboarding'}">Risk E Bank</title><style>body{font:17px system-ui;max-width:1000px;margin:3rem auto;padding:1rem;color:#183042;background:#f4f7fa}section,article{background:white;padding:1.5rem;margin:1rem 0;border-radius:12px}input,button,textarea{font:inherit;padding:.6rem;margin:.3rem;max-width:95%}button,a{color:#075a78}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.5rem;border-bottom:1px solid #ddd}code,pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style></head><body><nav aria-label="Session" th:if="${showLogout == true}"><form method="post" th:action="@{/logout}"><button type="submit">Log out</button></form></nav><h1 th:text="${bankName}"></h1><section><h2>Staff portal</h2><p>Welcome, <span th:text="${hire.verified_given}"></span>.</p><p>Department: <span th:text="${hire.department}"></span></p><p>Staff identifier: <span th:text="${hire.id}"></span></p></section></body></html>
