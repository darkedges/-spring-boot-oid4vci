# Activated via SPRING_PROFILES_ACTIVE=cloudflare — see docker-compose.cloudflare.yml and the "Hosting
# behind Cloudflare" section of README.md.
#
# No overrides needed here anymore: the Credential Issuer derives credential_issuer/credential_endpoint/
# the token iss/etc. from each request's own scheme+host (see application.yml's forward-headers-strategy
# and RequestBaseUrl) rather than a fixed config value, so the public HTTPS domain (issuer.zkp.au) comes
# back correctly to any Wallet on the public internet without a profile-specific override. Kept as an
# active profile in case a cloudflare-specific override is needed again later.
