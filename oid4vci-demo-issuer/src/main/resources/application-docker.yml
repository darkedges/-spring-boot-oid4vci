# Activated via SPRING_PROFILES_ACTIVE=docker (see docker-compose.yml).
#
# No overrides needed here anymore: the Credential Issuer derives credential_issuer/credential_endpoint/
# the token iss/etc. from each request's own scheme+host (see application.yml's forward-headers-strategy
# and RequestBaseUrl), so it no longer matters whether that's "issuer:8092" (docker-compose's internal
# service name) or a public hostname -- whichever one a client actually used comes back correctly. Kept
# as an active profile in case a docker-specific override is needed again later.
