# Activated via SPRING_PROFILES_ACTIVE=docker (see docker-compose.yml).
#
# credential-issuer is embedded verbatim into the served Credential Issuer Metadata document
# (credential_issuer, credential_endpoint, nonce_endpoint) and into the demo Wallet's own JWT decoder
# JWKS lookup (Oid4vciIssuerAutoConfiguration.jwtDecoder) — it must be a URL the Wallet container can
# actually reach, which under docker-compose is the service name, not "localhost" (that would resolve to
# the Wallet's own container instead of this one).
oid4vci:
  issuer:
    credential-issuer: "http://issuer:8092"
