server:
  port: 8092
  # Credential Issuer Metadata, minted tokens' iss, issued credentials' iss, and the DPoP htu check are
  # all built per-request from the scheme/host the client actually used (see RequestBaseUrl) rather than
  # a fixed config value -- this app may be reached directly, via docker-compose's internal network alias,
  # or via a public reverse-proxy hostname (see application-cloudflare.yml), and the same deployment must
  # reflect back whichever one was actually used. That only works correctly if X-Forwarded-Proto/Host from
  # a front door are trusted.
  forward-headers-strategy: framework

oid4vci:
  issuer:
    # Two configurations chosen to match oid4vp's existing demo data (given_name/family_name; doctype
    # org.iso.18013.5.1.mDL), for interop with the sibling oid4vp project's demo Verifier/Wallet -- see
    # the root README.
    #
    # vct is issuer-relative ("/vct/..."), not the literal https://demo.oid4vp.example/employee_credential
    # oid4vp-demo-verifier's own DCQL query still hardcodes: that domain is a deliberately non-routable
    # RFC 2606 placeholder, and the OpenID Conformance Suite's VCIFetchSdJwtVcTypeMetadata check does a
    # real HTTP GET straight to vct (confirmed live) -- it always failed to resolve. CredentialIssuerMetadataTemplate#resolve
    # rewrites this to this issuer's own actually-reachable base URL per request (see RequestBaseUrl), and
    # SdJwtVcTypeMetadataController serves real Type Metadata there. This does mean a credential issued
    # here no longer matches oid4vp-demo-verifier's hardcoded vct_values until that sibling repo's config
    # is updated to match -- a known, separate follow-up outside this repo.
    #
    # "scope" on each entry is OID4VCI-optional but HAIP-mandatory (Section 4.1 requires every
    # configuration have one; Section 4.3 requires Wallets request issuance via scope instead of
    # authorization_details) -- see AuthorizationEndpointController. Reusing each configuration's own id
    # as its scope value, a common convention with no other significance.
    credential-configurations-supported: >
      {"UniversityDegreeCredential":{"format":"dc+sd-jwt",
      "vct":"/vct/UniversityDegreeCredential","scope":"UniversityDegreeCredential",
      "claims":[{"path":["given_name"]},{"path":["family_name"],"mandatory":true}],
      "proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},
      "cryptographic_binding_methods_supported":["jwk"]},
      "PassportCredential":{"format":"dc+sd-jwt",
      "vct":"/vct/PassportCredential","scope":"PassportCredential",
      "claims":[{"path":["given_name"]},{"path":["family_name"],"mandatory":true},
      {"path":["birth_date"],"mandatory":true},{"path":["document_number"],"mandatory":true},
      {"path":["nationality"],"mandatory":true},{"path":["issuing_state"],"mandatory":true},
      {"path":["expiry_date"],"mandatory":true},{"path":["assurance_level"],"mandatory":true},
      {"path":["evidence"],"mandatory":true}],
      "proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},
      "cryptographic_binding_methods_supported":["jwk"]},
      "org.iso.18013.5.1.mDL":{"format":"mso_mdoc","doctype":"org.iso.18013.5.1.mDL","scope":"org.iso.18013.5.1.mDL",
      "claims":[{"path":["org.iso.18013.5.1","given_name"]},{"path":["org.iso.18013.5.1","family_name"],"mandatory":true}],
      "proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},
      "cryptographic_binding_methods_supported":["cose_key"]}}
    # Advertises batch_credential_issuance in the Issuer Metadata (OID4VCI 1.0 Final Section 12.2.4):
    # the Credential Endpoint accepts up to this many proofs per Credential Request, minting one
    # Credential per proof against the same claim values. 10 has no significance beyond matching the
    # spec's own non-normative metadata example.
    batch-credential-issuance-max-size: 10
    # Enables attest_jwt_client_auth (see ClientAttestationTrustAnchor): this is a throwaway demo "Wallet
    # Provider" keypair, checked in purely so the OpenID Conformance Suite's client_attestation variant has
    # something real to authenticate against out of the box -- only the public key lives here, matching
    # the pattern of every other checked-in demo key material in this app. The private half goes in the
    # conformance suite's own test configuration (client_attestation.attester_jwks), never in this repo.
    client-attestation-trusted-issuer: "https://wallet-provider.zkp.au"
    client-attestation-trusted-issuer-key: >
      {"kty":"EC","crv":"P-256","kid":"wallet-provider-1",
      "x":"9Al9vrGfZLj1Qi5Ltc4ekhgFaSOA69GcE0x8pyWdFeU",
      "y":"JvuZb_4rbI-aPSFGuYOtFpz5QRlWSFE8B4h5m_gnPwU","alg":"ES256"}
    # Enables the Challenge Endpoint (draft-ietf-oauth-attestation-based-client-auth Section 6): every
    # Client Attestation PoP JWT must then carry a matching, single-use "challenge" claim fetched from
    # here first, replacing the iat/jti-only replay defense with a server-issued nonce.
    attestation-challenge-endpoint-path: "/challenge"

# The identity-proofing flow (see ProofingController): a Wallet starts a session, the user proves who
# they are in the proofing app, that app's backend reports the verified result here server-to-server,
# and the Wallet collects a Credential Offer carrying claims from the actual passport.
demo:
  proofing:
    # Deliberately empty here, and read from the environment. This secret is the only thing standing
    # between the result endpoint and anyone able to reach this host minting a credential that asserts
    # any identity they choose, so it must not be a value that ships in a repository -- unlike the
    # throwaway Wallet Provider public key above, which is public by nature. Unset means the endpoint
    # refuses every call rather than accepting all of them.
    callback-secret: ${PROOFING_CALLBACK_SECRET:}
    # Long enough to scan an MRZ, hold a phone against a chip and pass a liveness challenge without
    # rushing; short enough that an abandoned session holding a Credential Offer does not linger.
    session-ttl: 15m
    pre-authorized-code-ttl: 10m
    credential-configuration-id: PassportCredential
