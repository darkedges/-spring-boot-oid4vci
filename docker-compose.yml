# Requires the jars to be built first: `mvn install -DskipTests` from the repo root (after the sibling
# oid4vp reactor has been installed into ~/.m2 — see README: "Prerequisites").
# Then: `docker compose up --build`.
#
# Only oid4vci's own two apps live here, same scope as oid4vp's own docker-compose.yml (just its Wallet +
# Verifier) — presenting an obtained credential doesn't need a Verifier baked into this stack at all: the
# Wallet's /present endpoint takes the Verifier's authorize URL as a per-request parameter (see README:
# "Cross-repo interop"), so it can target a locally-run oid4vp-demo-verifier, oid4vp's own docker-compose
# stack, or a publicly-hosted one (e.g. verify.irving.au) equally well, with zero config here either way.
services:
  issuer:
    build:
      context: ./oid4vci-demo-issuer
    ports:
      - "8092:8092"
    # Survives a reboot and a crash. Without it the issuer stops when the machine does, and the
    # symptom is remote and unhelpful: the wallet's proofing session simply never becomes ready,
    # while the tunnel in front of it still answers -- a 502 rather than a refused connection.
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # The secret the identity-proofing service presents on POST /proofing/result. Read from the
      # environment, never written here: it is the only thing standing between anyone who can reach
      # this host and a credential asserting any identity they choose.
      #
      # Unset means the endpoint refuses every call rather than accepting them, so a forgotten export
      # fails closed and says so in the log. Set the same value on the proofing service; in Kubernetes
      # it lives in the identity-proofing-issuer Secret.
      #
      #   export PROOFING_CALLBACK_SECRET="$(openssl rand -base64 32)"
      - PROOFING_CALLBACK_SECRET=${PROOFING_CALLBACK_SECRET:-}

  wallet:
    build:
      context: ./oid4vci-demo-wallet
    ports:
      - "8093:8093"
    restart: unless-stopped
    depends_on:
      - issuer
