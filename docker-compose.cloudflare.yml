# Layers on top of docker-compose.yml to expose the demo behind Cloudflare, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d --build
# Point a Cloudflare Tunnel at these two hostnames -> localhost ports (see README: "Hosting behind
# Cloudflare"). No domain-specific config to update: the issuer derives credential_issuer/token iss/etc.
# from each request's own Host/X-Forwarded-* headers (see RequestBaseUrl), so any tunnel hostname just
# works.
#
# Overrides (not adds to) the base file's SPRING_PROFILES_ACTIVE=docker on the issuer: the "cloudflare"
# profile is currently a documentation-only placeholder (see
# oid4vci-demo-issuer/src/main/resources/application-cloudflare.yml) for a future cloudflare-specific
# override, since URL derivation no longer needs one. The Wallet has no application-cloudflare.yml at all
# — it needs no profile-specific config either way, since every URL it calls (issuerUrl,
# verifierAuthorizeUrl) is a per-request parameter, not baked-in config.
services:
  issuer:
    environment:
      - SPRING_PROFILES_ACTIVE=cloudflare
      - PROOFING_CALLBACK_SECRET=${PROOFING_CALLBACK_SECRET}
